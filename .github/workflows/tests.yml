name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: full suite (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        # The rule corpus samples real binaries from the runner's own System32
        # and Program Files. That is the point: it is a different set of clean
        # software from the developer's machine, so CI is a second opinion on
        # whether any rule is over-broad, not a repeat of the same measurement.
        env:
          AVGUARD_DATA: ${{ runner.temp }}/avguard-data
        # Not `python -m unittest` directly: Actions logs need authentication
        # to read, so a bare failure gives an outside observer exactly one line
        # through the API -- "Process completed with exit code 1". This runner
        # emits each failure as an annotation, which is public.
        run: python tools/ci_tests.py

      - name: End-to-end checks
        # Python, not PowerShell. The PowerShell version failed for a reason
        # that had nothing to do with AVGuard: pwsh 7.4 turns a native
        # command's non-zero exit into a terminating error when
        # ErrorActionPreference is Stop, which Actions sets -- and `--scan`
        # exits 1 when it finds something, which is the entire point of the
        # check. Python also means these run identically on a laptop, so a
        # CI-only failure in the checks themselves cannot happen again.
        run: python tools/ci_smoke.py

  linux:
    name: imports cleanly (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # No pystray or Pillow: the tray icon is Windows-only here and pulls in
        # GTK on Linux for no benefit.
        run: pip install yara-python watchdog requests pefile

      - name: Import every module
        # AVGuard only does anything useful on Windows, but it must still
        # import elsewhere. `from ctypes import wintypes` at module scope
        # raises ValueError on Linux and took the whole package down with it,
        # so nobody could read the code on a Mac without the import failing.
        run: |
          python - <<'PY'
          import importlib
          modules = ["config", "protection", "scanner", "quarantine", "cloud",
                     "watcher", "logsetup", "instance", "archives", "peinfo",
                     "events", "signing", "scheduling"]
          for name in modules:
              importlib.import_module(f"avguard.{name}")
              print(f"  ok  avguard.{name}")
          from avguard.signing import SignatureChecker
          assert not SignatureChecker().available, "signing must report unavailable off Windows"
          print("signature checking correctly reports unavailable")
          PY

      - name: Run the platform-independent tests
        env:
          AVGUARD_DATA: /tmp/avguard-ci
        run: python tools/ci_tests.py
